name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  real-contract:
    needs: verify
    runs-on: ubuntu-latest
    environment: contract
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run optional live contract test
        env:
          ZOLTA_IDENTITY_CONTRACT_HOSTED_AUTH_URL: ${{ secrets.ZOLTA_IDENTITY_CONTRACT_HOSTED_AUTH_URL }}
          ZOLTA_IDENTITY_CONTRACT_HOSTED_APPLICATION: ${{ secrets.ZOLTA_IDENTITY_CONTRACT_HOSTED_APPLICATION }}
        run: |
          if [ -z "$ZOLTA_IDENTITY_CONTRACT_HOSTED_AUTH_URL" ]; then
            echo 'Live contract test skipped: configure the contract environment secrets to enable it.'
            exit 0
          fi
          pnpm test:contract
