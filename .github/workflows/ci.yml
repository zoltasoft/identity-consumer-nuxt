name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  real-contract:
    if: ${{ secrets.ZOLTA_IDENTITY_CONTRACT_HOSTED_AUTH_URL != '' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: contract
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract
        env:
          ZOLTA_IDENTITY_CONTRACT_HOSTED_AUTH_URL: ${{ secrets.ZOLTA_IDENTITY_CONTRACT_HOSTED_AUTH_URL }}
          ZOLTA_IDENTITY_CONTRACT_HOSTED_APPLICATION: ${{ secrets.ZOLTA_IDENTITY_CONTRACT_HOSTED_APPLICATION }}
